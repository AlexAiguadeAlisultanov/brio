# Despliegue del proxy de Brío en Render (runtime docker, contexto = raíz del monorepo).
# La app móvil apunta aquí con EXPO_PUBLIC_API_URL. La clave de la API vive solo en Render
# (sync:false): sin ella, el proxy responde 503 {fallback:true} y la app usa su motor local.
services:
  - type: web
    name: brio-proxy
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: apps/proxy/Dockerfile
    dockerContext: .
    healthCheckPath: /api/salud
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODELO_LLM
        value: claude-opus-5-5
      - key: ORIGEN_PERMITIDO
        sync: false
      - key: TOPE_PETICIONES_DIA
        value: "500"
      # Secreto para firmar los tokens de sesión. Lo pones tú en el panel de Render.
      - key: TOKEN_SECRETO
        sync: false
      # Base de datos persistente en Turso (libSQL). Las pones tú: crea la base con
      # `turso db create brio` y el token con `turso db tokens create brio`; la URL sale de
      # `turso db show brio --url`. Sin BRIO_DB_URL el proxy cae a un fichero SQLite local
      # (DB_PATH), cuyo disco es EFÍMERO en Render: las cuentas se pierden en cada despliegue.
      - key: BRIO_DB_URL
        sync: false
      - key: BRIO_DB_TOKEN
        sync: false
      # Respaldo local si no hay Turso (solo desarrollo o demo desechable).
      - key: DB_PATH
        value: ./datos/brio.db
      # Pagos (Stripe). En modo pruebas, claves sk_test_ y whsec_. Las pones tú.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: PRECIO_CENTIMOS
        value: "499"
      - key: MONEDA
        value: eur
      - key: URL_EXITO
        sync: false
      - key: URL_CANCELAR
        sync: false
